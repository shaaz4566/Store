<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SZC Image URL Uploader</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4eee5;color:#33271e;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}.brand{font-size:30px;font-weight:800;letter-spacing:-.04em}.sub{color:#74665a;margin:5px 0 24px}
.card{background:#fffaf3;border:1px solid #dfd2c3;border-radius:20px;padding:22px;box-shadow:0 12px 35px #33271e12;margin-top:16px}
h2{margin:0 0 8px;font-size:20px}.hint{font-size:13px;color:#74665a;line-height:1.5}
label{display:block;font-weight:700;margin:16px 0 7px}input,select{width:100%;padding:13px 14px;border:1px solid #cdbfaf;border-radius:12px;background:#fff;color:#33271e;font:inherit}
button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;background:#4f6049;color:white;margin-top:16px}.secondary{background:#e9dfd3;color:#33271e;margin-left:8px}
#preview{display:none;width:100%;max-height:330px;object-fit:contain;border-radius:14px;margin-top:16px;background:#eee4d8}
.row{display:flex;gap:10px;align-items:center}.row button{white-space:nowrap}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eee4d8;display:none}.urlbox{display:none;margin-top:16px}.urlbox input{background:#f7f1e9}
@media(max-width:560px){.row{display:block}.row button{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">SZC</div><div class="sub">Private Image URL Uploader</div>
<div class="card">
<h2>Upload an image</h2>
<p class="hint">This page is for you to upload product/category images to your Firebase Storage. It does not need to be added to your GitHub website. Open this file locally, sign in with your admin Google account, upload an image, then copy the generated URL.</p>
<label>Image type</label>
<select id="folder"><option value="products">Product photo</option><option value="categories">Category photo</option><option value="general">Other store image</option></select>
<label>Choose photo</label>
<input id="file" type="file" accept="image/*">
<img id="preview" alt="Preview">
<div class="row"><button id="signIn">Sign in as admin</button><button id="upload" class="secondary" disabled>Upload & get URL</button></div>
<div id="status" class="status"></div>
<div id="urlbox" class="urlbox"><label>Photo URL</label><div class="row"><input id="url" readonly><button id="copy" class="secondary">Copy URL</button></div></div>
</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

const firebaseConfig={
  apiKey: "AIzaSyDK-LwOv6BtWJAhUsj8lygT91Zz2RTYzgc",
  authDomain: "szc-store.firebaseapp.com",
  projectId: "szc-store",
  storageBucket: "szc-store.firebasestorage.app",
  messagingSenderId: "777209021202",
  appId: "1:777209021202:web:848df3f5af2074e4d5e9cb",
  measurementId: "G-0JL66D2KED"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),storage=getStorage(app);
const ADMIN_UID="ihSDHUk86DY8McVcLN7gjzt96Bm1";
const $=id=>document.getElementById(id);
function status(t,good=false){$("status").style.display="block";$("status").textContent=t;$("status").style.background=good?"#dfead8":"#eee4d8"}
$("file").onchange=()=>{const f=$("file").files[0];if(!f)return;$("preview").src=URL.createObjectURL(f);$("preview").style.display="block";};
$("signIn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status(e.message)}};
onAuthStateChanged(auth,u=>{if(u&&u.uid===ADMIN_UID){status("Admin signed in. You can upload.",true);$("upload").disabled=false;$("signIn").textContent="Admin signed in"}else if(u){status("This Google account is not the SZC admin account.");$("upload").disabled=true}});
$("upload").onclick=async()=>{
 const f=$("file").files[0]; if(!f)return status("Choose an image first.");
 if(f.size>10*1024*1024)return status("Image must be 10 MB or smaller.");
 try{
  $("upload").disabled=true;status("Uploading…");
  const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"-");
  const path=`public-images/${$("folder").value}/${Date.now()}-${crypto.randomUUID()}-${safe}`;
  const r=ref(storage,path);
  await uploadBytes(r,f,{contentType:f.type,cacheControl:"public,max-age=31536000"});
  const url=await getDownloadURL(r);
  $("url").value=url;$("urlbox").style.display="block";status("Upload complete. Copy the URL and paste it into your product or category.",true);
 }catch(e){console.error(e);status(e.message||"Upload failed")}finally{$("upload").disabled=false}
};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("url").value);$("copy").textContent="Copied ✓";setTimeout(()=>$("copy").textContent="Copy URL",1400)}
</script>
</body>
</html>
