<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SZC Store — Admin</title>
<link rel="stylesheet" href="admin.css?v=20260827-export-repair1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">SZC</a>
  <div class="top-title"><strong>Store Admin</strong><span>Store management</span></div>
  <div class="top-actions">
    <a class="top-link" href="index.html" target="_blank" rel="noopener">View store ↗</a>
    <button id="adminLogin" class="top-login">Sign in with Google</button>
  </div>
</header>

<section id="authGate" class="auth-gate">
  <div class="login-card">
    <div class="admin-mark">SZC</div>
    <p class="eyebrow">PRIVATE ADMIN AREA</p>
    <h1>Sign in to continue.</h1>
    <p>Only the authorized SZC administrator can open the store management tools.</p>
    <button id="pageLogin" class="primary big">Continue with Google ↗</button>
  </div>
</section>

<main id="adminApp" hidden>
  <aside class="sidebar">
    <div class="side-heading">STORE MANAGEMENT</div>
    <button class="nav-item active" data-tab="dashboard"><span>⌂</span>Dashboard</button>
    <button class="nav-item" data-tab="products"><span>▦</span>Products <b id="navProductCount">0</b></button>
    <button class="nav-item" data-tab="orders"><span>◫</span>Orders <b id="navOrderCount">0</b></button>
    <button class="nav-item" data-tab="customers"><span>♙</span>Customers</button>
    <button class="nav-item" data-tab="settings"><span>⚙</span>Payment & Store</button>
    <div class="sidebar-bottom"><a href="index.html" target="_blank" rel="noopener" class="outline">Open customer store ↗</a></div>
  </aside>
  <section class="workspace"><div id="view"></div></section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div id="modalBody" class="modal-card"></div>
</div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="admin.js?v=20260827-export-repair1"></script>
</body>
</html>
