<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SZC Admin</title>
<link rel="stylesheet" href="admin.css?v=20260826-3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
</head>
<body>
<header>
  <a href="index.html" class="brand">SZC</a>
  <span>Store Admin</span>
  <button id="adminLogin">Sign in with Google</button>
</header>

<!-- This is the ONLY content visible before administrator verification. -->
<section id="authGate" class="auth-gate">
  <div class="login-card">
    <div class="admin-mark">SZC</div>
    <p class="eyebrow">PRIVATE ADMIN AREA</p>
    <h1 class="title">Sign in to continue.</h1>
    <p class="muted">Use the authorized Google account to access the store dashboard.</p>
    <button class="primary login-large" id="pageLogin">Continue with Google ↗</button>
    <p class="security-note">Administrator access is checked using your Firebase Authentication UID.</p>
  </div>
</section>

<main id="adminApp" hidden>
  <aside id="adminSidebar">
    <button class="tab active" data-tab="dashboard">Overview</button>
    <button class="tab" data-tab="products">Products</button>
    <button class="tab" data-tab="orders">Orders & Shipping</button>
    <button class="tab" data-tab="customers">Customers</button>
    <button class="tab" data-tab="settings">Payment Options</button>
  </aside>
  <section class="content"><div id="view"></div></section>
</main>

<div id="toast"></div>
<script type="module" src="admin.js?v=20260826-3"></script>
</body>
</html>
